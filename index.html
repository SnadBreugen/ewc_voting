  :root{
    --bg:#0b0b0d;--panel:#141417;--panel2:#17171b;--line:#26262c;--ink:#f3f3f3;--mut:#8b8b92;
    --accent:#DB622A;--accent2:#D2894F;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"RiformaMono",ui-monospace,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
  body{background-image:radial-gradient(120% 60% at 70% -10%, rgba(219,98,42,0.14), rgba(0,0,0,0) 60%);background-attachment:fixed}
  .wrap{max-width:900px;margin:0 auto;padding:28px 18px 120px}
  header{padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .kick{font-size:12px;letter-spacing:5px;color:var(--accent2);text-transform:uppercase}
  .kbar{height:3px;width:120px;background:var(--accent);margin:8px 0 14px}
  h1{font-family:"RiformaBold",sans-serif;font-size:clamp(34px,7vw,64px);line-height:0.92;letter-spacing:-0.03em;margin:0;text-transform:uppercase}
  h1 .o{color:var(--accent)}
  .lede{font-size:13px;color:var(--mut);line-height:1.6;max-width:560px;margin-top:14px}
  .idbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 22px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .idbar label{font-size:11px;letter-spacing:2px;color:var(--mut);text-transform:uppercase}
  select{font-family:"RiformaBold",sans-serif;font-size:16px;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:10px 12px;cursor:pointer;min-width:220px}
  .idnote{font-size:12px;color:var(--mut)}
  .idnote b{color:var(--accent2);font-family:"RiformaBold",sans-serif}
  .row{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:14px 16px;margin-bottom:12px}
  .num{font-family:"RiformaBold",sans-serif;font-size:30px;color:var(--mut);min-width:54px;text-align:center;letter-spacing:-0.03em}
  .mid{flex:1;min-width:0}
  .ttl{font-family:"RiformaBold",sans-serif;font-size:19px;letter-spacing:-0.01em;line-height:1.15}
  .art{font-size:12px;color:var(--mut);margin:3px 0 10px;letter-spacing:1px;text-transform:uppercase}
  audio{width:100%;height:36px;filter:grayscale(1) contrast(1.05);opacity:0.92}
  .vote{display:flex;flex-direction:column;align-items:flex-end;gap:9px;min-width:150px}
  .pts{display:flex;gap:7px}
  .pts button{font-family:"RiformaBold",sans-serif;font-size:18px;width:46px;height:46px;border-radius:7px;
    border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;transition:.12s;line-height:1}
  .pts button:hover:not(:disabled){border-color:#44444c}
  .pts button.on{background:var(--accent);border-color:var(--accent);color:#120804;box-shadow:0 0 18px rgba(219,98,42,0.45)}
  .pts button:disabled{opacity:.4;cursor:not-allowed}
  .tot{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
  .tot b{color:var(--accent2);font-family:"RiformaBold",sans-serif;font-size:13px}
  .statusbar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,12,0.92);border-top:1px solid var(--line);
    backdrop-filter:blur(8px);padding:9px 18px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0));
    display:flex;justify-content:space-between;font-size:11px;color:var(--mut);letter-spacing:1px}
  .statusbar b{color:var(--ink)}
  .save{font-size:11px;letter-spacing:1px;color:var(--mut)}
  .save.ok{color:#5fbf6a}.save.err{color:#e5704d}
  @media(max-width:640px){
    .row{flex-wrap:wrap}.num{min-width:40px;font-size:24px}
    .vote{min-width:0;width:100%;flex-direction:row;justify-content:space-between;align-items:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kick">EWC 2026 · Remix Contest</div>
    <div class="kbar"></div>
    <h1>Jury <span class="o">Voting</span></h1>
    <div class="lede">Listen to each entry and give it 1, 2 or 3 points. Pick your name first. Your votes save automatically. Tap a selected number again to clear it.</div>
  </header>

  <div class="idbar">
    <label for="juror">You are</label>
    <select id="juror"><option value="">Select your name…</option></select>
    <span class="idnote" id="idnote">Pick your name to start voting.</span>
  </div>

  <div id="list"></div>
</div>

<div class="statusbar">
  <span class="save" id="save">ready</span>
  <span>Snad Industries · <b>v0.4</b></span>
</div>

<script>
(function(){
  /* ===== CONFIG ===== */
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyfSQW0O9tSvXqgWr_3I-j7RuXcUVy_5BusgXYwtEcMFYDeH-Cz4fC4R7k9n-e5KdI-/exec";
  var JURORS = ["Daniel Rowland", "Simon Heger", "Manon Dave"];
  var TRACKS = [{"id": "t1", "title": "Last Prophecy", "artist": "TrackSharks", "file": "t1.mp3"}, {"id": "t2", "title": "Push", "artist": "TrackSharks", "file": "t2.mp3"}, {"id": "t3", "title": "The Hour is Here", "artist": "TrackSharks", "file": "t3.mp3"}];
  /* ===== */

  var listEl=document.getElementById('list'), sel=document.getElementById('juror');
  var idnote=document.getElementById('idnote'), saveEl=document.getElementById('save');
  var juror = localStorage.getItem('ewc_juror') || '';
  var myVotes={}, totals={}, nodes={};

  JURORS.forEach(function(n){ var o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
  if(juror && JURORS.indexOf(juror)>=0){ sel.value=juror; } else { juror=''; }

  function setSave(t,cls){ saveEl.textContent=t; saveEl.className='save'+(cls?' '+cls:''); }

  function jsonp(params){
    return new Promise(function(resolve){
      var cb='cb_'+Math.random().toString(36).slice(2);
      var s=document.createElement('script');
      var done=function(d){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode)s.parentNode.removeChild(s); resolve(d); };
      window[cb]=function(d){ done(d); };
      var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
      s.src=WEBAPP_URL+'?'+q+'&callback='+cb;
      s.onerror=function(){ done({ok:false,error:'network'}); };
      document.body.appendChild(s);
      setTimeout(function(){ if(window[cb]) done({ok:false,error:'timeout'}); },15000);
    });
  }

  function buildRows(){
    listEl.innerHTML=''; nodes={};
    var frag=document.createDocumentFragment();
    TRACKS.forEach(function(t,i){
      var row=document.createElement('div'); row.className='row';
      var num=document.createElement('div'); num.className='num'; num.textContent=String(i+1).padStart(2,'0');
      var mid=document.createElement('div'); mid.className='mid';
      var ttl=document.createElement('div'); ttl.className='ttl'; ttl.textContent=t.title||'';
      var art=document.createElement('div'); art.className='art'; art.textContent=t.artist||'';
      var au=document.createElement('audio'); au.controls=true; au.preload='none'; au.src=t.file;
      mid.appendChild(ttl); mid.appendChild(art); mid.appendChild(au);
      var vote=document.createElement('div'); vote.className='vote';
      var pts=document.createElement('div'); pts.className='pts'; var btns={};
      [1,2,3].forEach(function(p){
        var b=document.createElement('button'); b.type='button'; b.textContent=p;
        b.addEventListener('click',function(){ cast(t,p); });
        pts.appendChild(b); btns[p]=b;
      });
      var tot=document.createElement('div'); tot.className='tot';
      vote.appendChild(pts); vote.appendChild(tot);
      row.appendChild(num); row.appendChild(mid); row.appendChild(vote);
      nodes[t.id]={btns:btns,tot:tot};
      frag.appendChild(row);
    });
    listEl.appendChild(frag);
    paint();
  }

  function paint(){
    TRACKS.forEach(function(t){
      var n=nodes[t.id]; if(!n) return;
      var my=myVotes[t.id];
      [1,2,3].forEach(function(p){
        n.btns[p].classList.toggle('on', my===p);
        n.btns[p].disabled = !juror;
      });
      var sum = (typeof totals[t.id]==='number') ? totals[t.id] : 0;
      n.tot.innerHTML='Total <b>'+sum+'</b> pts';
    });
  }

  function cast(t,p){
    if(!juror){ idnote.textContent='Pick your name first.'; return; }
    var prev=myVotes[t.id];
    var val = (prev===p) ? '' : p;
    if(val==='') delete myVotes[t.id]; else myVotes[t.id]=p;
    paint(); setSave('saving…');
    jsonp({action:'vote',juror:juror,track:t.id,title:t.title,points:val}).then(function(r){
      if(r&&r.ok){ setSave('saved','ok'); refresh(); }
      else{ setSave('save failed, retry','err'); }
    });
  }

  function refresh(){
    if(!juror){ return; }
    jsonp({action:'get',juror:juror}).then(function(r){
      if(r&&r.ok){ myVotes=r.votes||{}; totals=r.totals||{}; paint(); }
    });
  }

  sel.addEventListener('change',function(){
    juror=sel.value||'';
    if(juror){ localStorage.setItem('ewc_juror',juror); idnote.innerHTML='Voting as <b>'+juror.replace(/</g,'&lt;')+'</b>'; }
    else { localStorage.removeItem('ewc_juror'); idnote.textContent='Pick your name to start voting.'; myVotes={}; }
    paint(); refresh();
  });

  buildRows();
  if(juror){ idnote.innerHTML='Voting as <b>'+juror.replace(/</g,'&lt;')+'</b>'; }
  refresh();
})();
</script>
</body>
</html>
